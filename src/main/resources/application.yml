spring:
  h2:
    console:
      enabled: true
  datasource:
    url: jdbc:h2:mem:database
    username: sa
  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
    properties:
      hibernate:
        show_sql: true
        format_sql: true
    show-sql: true

---

spring:
  config:
    activate:
      on-profile: default

springdoc:
  packages-to-scan: roomescape
  default-consumes-media-type: application/json;charset=UTF-8
  default-produces-media-type: application/json;charset=UTF-8
  cache:
    disabled: true
  api-docs:
    path: /api-docs/json
    groups:
      enabled: true
  swagger-ui:
    enabled: true
    path: /swagger/api-docs.html
    tags-sorter: alpha
    operations-sorter: alpha

toss:
  payments:
    base-url: https://api.tosspayments.com
    widget-secret-key: ${TOSS_SECRET_KEY}

---

spring:
  config:
    activate:
      on-profile: test

  sql:
    init:
      mode: never
  jpa:
    properties:
      hibernate:
        show_sql: false
    show-sql: false
    hibernate:
      ddl-auto: create-drop
toss:
  payments:
    base-url: http://localhost:8080
    widget-secret-key: test-toss-secret-key
