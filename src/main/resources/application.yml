spring:
  profiles:
    active: auth,pay

  thymeleaf:
    cache: false
    prefix: classpath:/templates/

  h2:
    console:
      enabled: true

  datasource:
    url: jdbc:h2:mem:DATABASE

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    properties:
        hibernate:
            format_sql: true

  sql:
    init:
      mode: always
