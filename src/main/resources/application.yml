spring:
  h2:
    console:
      enabled: true
      path: /h2-console

  datasource:
    url: jdbc:h2:mem:database
    username: sa
    password: password

  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

security:
  jwt:
    access-token:
      secret-key: since-jjwt-api-0.11-secret-key-must-be-longer-than-32-bytes
      validity-in-milliseconds: 900000 # 15 minutes

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql: trace

toss:
  confirm-url: https://api.tosspayments.com/v1/payments/confirm
  secret-key: test_gsk_docs_OaPz8L5KdmQXkzRz3y47BMw6

springdoc:
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
