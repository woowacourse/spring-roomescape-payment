springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

toss:
  payment:
    base-url: https://api.tosspayments.com/v1
    auth-scheme: Basic
    timeout:
      connect: 2
      read: 30
    path:
      confirm: /payments/confirm
spring:
  profiles:
    active: dev
