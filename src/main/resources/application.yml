spring:
  h2:
    console:
      enabled: true
  datasource:
    url: jdbc:h2:mem:database
    username: sa
  jpa:
    properties:
      hibernate:
        show_sql: true
        format_sql: true
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
  aop:
    proxy-target-class: true

logging:
  level:
    roomescape.global.logging: INFO
    roomescape: DEBUG
  pattern:
    console: "[%d{yyyy-MM-dd HH:mm:ss}] [%level] [%thread] %logger{36} - %msg%n"
    file: "[%d{yyyy-MM-dd HH:mm:ss}] [%level] [%thread] %logger{36} - %msg%n"
  file:
    name: logs/roomescape.log
    max-size: 10MB
    max-history: 30

toss:
