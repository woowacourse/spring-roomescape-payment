spring:
  config:
    import: classpath:application-secrets-test.yml

  datasource:
    url: ${db.url}
    username: ${db.username}
    password: ${db.password}

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      data-locations: classpath:testData.sql

logging:
  level:
    root: off
